name: Build and migration checks
on: [pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/migration.test.mjs
      - run: node --test scripts/contrast.test.mjs
      - run: node --test scripts/phone.test.mjs
      - run: node --test scripts/sms.test.mjs
      - run: node --test scripts/i18n.test.mjs
      - run: node --test scripts/names.test.mjs
      - run: npm run build
      # Boots the built Worker and asserts that an unmatched path returns 404
      # and the migration redirects return 301. `npm run build` alone cannot
      # catch either: both depend on the Cloudflare bindings, which only exist
      # at runtime.
      - run: npm run check:worker
