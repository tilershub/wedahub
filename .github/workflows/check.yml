name: Build and migration checks
on: [pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/migration.test.mjs scripts/phone-auth.test.mjs scripts/job-workflow.test.mjs scripts/job-database.test.mjs scripts/job-api.test.mjs
      - run: npm run build
      # Boots the built Worker and asserts that an unmatched path returns 404
      # and the migration redirects return 301. `npm run build` alone cannot
      # catch either: both depend on the Cloudflare bindings, which only exist
      # at runtime.
      - run: npm run check:worker
