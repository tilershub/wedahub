name = "wedahub"
# Preserve runtime variables managed in the Cloudflare dashboard on every deploy.
# API tokens and hook signing keys should still be stored as encrypted Secrets.
keep_vars = true
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = "./dist/_worker.js/index.js"

[assets]
directory = "./dist"
not_found_handling = "none"
# Required, not optional. With not_found_handling = "none" an unmatched request
# falls through to the Worker, and the Astro adapter's no-route-matched branch
# calls env.ASSETS.fetch() before it renders anything — including before the
# middleware runs. Without this binding env.ASSETS is undefined, so every URL
# that is not an exact route match dies with a TypeError and Cloudflare returns
# 500 (error 1101) instead of a 404 page or a migration redirect.
binding = "ASSETS"

[vars]
SUPABASE_URL = "https://ginrgwaciblcvxvkbeyd.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpbnJnd2FjaWJsY3Z4dmtiZXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjUyODMsImV4cCI6MjA5NDk0MTI4M30.vcfg0gTKSdyKgqggK3OAFwUYwLSfr-QkN2mRFFr_R1M"

