name = "wedahub"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Astro 7's Cloudflare adapter ships its own entrypoint and builds the Worker
# through the Cloudflare Vite plugin. Pointing main at dist/_worker.js/index.js
# now fails the build before it starts: the plugin validates main while
# resolving config, which is before the file it names has been generated.
main = "@astrojs/cloudflare/entrypoints/server"

[assets]
directory = "./dist"
not_found_handling = "none"
# Required, not optional. With not_found_handling = "none" an unmatched request
# falls through to the Worker, and the Astro adapter's no-route-matched branch
# calls env.ASSETS.fetch() before it renders anything — including before the
# middleware runs. Without this binding env.ASSETS is undefined, so every URL
# that is not an exact route match dies with a TypeError and Cloudflare returns
# 500 (error 1101) instead of a 404 page or a migration redirect.
binding = "ASSETS"

[vars]
SUPABASE_URL = "https://ginrgwaciblcvxvkbeyd.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpbnJnd2FjaWJsY3Z4dmtiZXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjUyODMsImV4cCI6MjA5NDk0MTI4M30.vcfg0gTKSdyKgqggK3OAFwUYwLSfr-QkN2mRFFr_R1M"

# Set these in the Cloudflare dashboard:
#   Workers & Pages → wedahub → Settings → Variables and Secrets
#
#   ANTHROPIC_API_KEY     = sk-ant-...
#   SUPABASE_URL          = https://ginrgwaciblcvxvkbeyd.supabase.co
#   SUPABASE_ANON_KEY     = eyJhbGci...
#   SUPABASE_SERVICE_ROLE_KEY = eyJhbGci...  (keep secret — never expose to browser)
#
#   For local dev: add all the above to .env
